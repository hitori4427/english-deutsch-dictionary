<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>英德電子辭典</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>英德電子辭典</h1>
      <p>English → Deutsch · 原生功能備份版（Web/PWA）</p>
      <button id="installBtn" class="ghost">📲 加到主畫面</button>
    </header>

    <section id="authGate" class="card hidden">
      <h2>保護頁面</h2>
      <p>請先輸入通行碼，避免未授權人員直接使用。</p>
      <div class="grid">
        <input id="passInput" type="password" placeholder="輸入通行碼" autocomplete="off" />
        <button id="passSubmit">進入</button>
      </div>
      <p id="passError" class="error"></p>
    </section>

    <section id="appMain" class="card">
      <div class="topbar">
        <label>搜尋英文</label>
        <input id="searchInput" type="search" placeholder="例如：apple, ticket" />
      </div>
      <nav id="alphabetNav" class="alphabet" aria-label="依英文字母瀏覽"></nav>
      <div id="browseHeading" class="browse-heading"></div>
      <ul id="suggestions" class="list"></ul>
      <article id="resultCard" class="entry hidden"></article>

      <details class="entry">
        <summary>AI 設定（MiniMax）</summary>
        <div class="grid">
          <input id="apiKey" type="password" placeholder="MiniMax API Key" />
          <input id="endpoint" type="url" placeholder="API endpoint" />
          <select id="modelSelect"></select>
          <input id="timeout" type="number" min="5" max="120" step="1" />
          <button id="testBtn">測試 API 設定</button>
        </div>
        <p id="settingsInfo" class="muted">目前未設定 API Key 時，將只使用本機辭典。</p>
      </details>

      <details id="favoritesPanel" class="entry">
        <summary>收藏</summary>
        <ul id="favoritesList" class="list"></ul>
      </details>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
