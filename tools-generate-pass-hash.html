<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>English→Deutsch：產生通行碼雜湊</title>
  <style>
    body {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 24px;}
    input, button {padding: 10px; font-size: 16px;}
    pre {white-space: pre-wrap; background: #f6f6f6; padding: 12px; border-radius: 8px;}
  </style>
</head>
<body>
  <h1>產生 accessPassHash</h1>
  <p>輸入一組你自己的通行碼，會得到 SHA-256 雜湊。把結果貼到 <code>config.js</code> 的 <code>accessPassHash</code>。</p>
  <label>通行碼：<br/><input id="p" type="password" /></label>
  <button id="go">產生雜湊</button>
  <p><strong>SHA-256</strong></p>
  <pre id="out">（請輸入通行碼）</pre>
  <script>
    async function sha256(text) {
      const utf8 = new TextEncoder().encode(text);
      const hash = await crypto.subtle.digest('SHA-256', utf8);
      return Array.from(new Uint8Array(hash)).map((b) => b.toString(16).padStart(2, '0')).join('');
    }
    document.getElementById('go').addEventListener('click', async () => {
      const p = document.getElementById('p').value || '';
      const out = p ? await sha256(p) : '';
      document.getElementById('out').textContent = out || '（請輸入通行碼）';
    });
  </script>
</body>
</html>
